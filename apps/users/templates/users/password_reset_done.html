{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMS</title>
    <link rel="stylesheet" href="{% static 'css/password_reset_done.css' %}">
</head>
<body>
    <div class="content">
        <h2>Check your Email</h2>
        <p>We have sent you a password reset link. Please check your inbox.</p>
        
        <p class="resend">I don't receive reset link?</p>
        <form method="post" action="{% url 'resend_reset_email' %}">
            {% csrf_token %}
            <button type="submit">🔁 Resend Link</button>
        </form>

        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            </div>
        {% endif %}
    </div>
</body>
</html>
