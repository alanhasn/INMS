{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset Email Sent</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-200">
    <section class="w-full max-w-md p-8 bg-gray-900/80 rounded-2xl shadow-2xl border border-gray-800 text-center">
      <h2 class="text-3xl font-bold text-cyan-400 mb-3">Check Your Email</h2>
      <p class="text-gray-400 mb-6">
        We’ve sent you a password reset link. Please check your inbox.
      </p>

      <p class="text-sm text-gray-400 mb-3">Didn’t receive the reset link?</p>
      <form method="post" action="{% url 'resend_reset_email' %}">
        {% csrf_token %}
        <button type="submit"
          class="w-full py-3 bg-cyan-500 hover:bg-cyan-600 text-black font-bold rounded-lg transition hover:scale-[1.02] shadow-lg">
          🔁 Resend Link
        </button>
      </form>

      {% if messages %}
        <div class="mt-4 space-y-2">
          {% for message in messages %}
            <p class="text-sm text-red-400">{{ message }}</p>
          {% endfor %}
        </div>
      {% endif %}
    </section>
  </body>
</html>
