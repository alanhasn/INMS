<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // It redirects the user after a delay.
        setTimeout(function() {
            const redirectUrl = "{% url redirect_url %}";
            if (redirectUrl) {
                window.location.href = redirectUrl;
            }
        }, 2000); // Redirect after 2 seconds
    </script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-200 font-sans">

    <!-- Main card container, styled to match the profile page -->
    <main class="w-full max-w-md p-8 text-center bg-gray-900/80 rounded-2xl shadow-2xl border border-gray-800">
        
        <!-- The message passed from the Django view -->
        <h1 class="text-3xl font-bold text-cyan-400">{{ message }}</h1>

        <!-- Tailwind CSS spinner -->
        <div class="w-12 h-12 mx-auto my-8 border-4 border-gray-700 rounded-full border-t-cyan-400 animate-spin"></div>

        <p class="text-gray-400">You will be redirected shortly...</p>

    </main>

</body>
</html>
