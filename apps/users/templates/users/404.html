{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome for Icons (optional, but good for consistency) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-200 font-sans p-4">

    <!-- The main container, styled to match the edit profile page -->
    <div class="w-full max-w-md text-center p-8 bg-gray-900/80 rounded-2xl shadow-2xl border border-gray-800">
        
        <!-- Large 404 heading with the primary accent color -->
        <h1 class="text-9xl font-black text-cyan-400 tracking-wider">404</h1>
        
        <!-- Descriptive message -->
        <p class="mt-4 text-xl text-gray-300">Oops! Page Not Found</p>
        
        <!-- Sub-message -->
        <p class="mt-2 text-gray-400">The page you are looking for does not exist or has been moved.</p>
        
        <!-- A button-style link to go back home, matching the style of buttons on the edit profile page -->
        <div class="mt-8">
            <a href="{% url 'profile' %}" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-cyan-500 hover:bg-cyan-600 text-black font-bold rounded-lg shadow-lg transition-transform duration-300 ease-in-out hover:scale-105">
                <i class="fas fa-home"></i>
                <span>Go Back Home</span>
            </a>
        </div>
    </div>

</body>
</html>
