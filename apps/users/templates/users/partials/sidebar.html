{% load static %}
<!-- ====================== -->
<!-- SIDEBAR NAVIGATION    -->
<!-- ====================== -->
<aside id="sidebar" class="fixed inset-y-0 left-0 bg-slate-900 border-r border-slate-800 w-64 transform -translate-x-full md:translate-x-0 transition-transform duration-300 ease-in-out z-40 flex flex-col">
    <!-- Sidebar Header -->
    <div class="flex items-center gap-3 px-6 py-5 border-b border-slate-800">
        <i class='bx bx-network-chart text-3xl text-cyan-400'></i>
        <div>
            <h3 class="text-xl font-bold text-white">INMS</h3>
            <p class="text-xs text-slate-400">Network Management</p>
        </div>
    </div>

    <!-- Navigation Menu -->
    <nav class="flex-1 px-4 py-4">
        <ul class="space-y-2">
            <li>
                <a href="{% url 'dashboard' %}" class="flex items-center gap-3 px-4 py-2.5 rounded-lg font-medium bg-cyan-500/10 text-cyan-300">
                    <i class='bx bxs-dashboard text-xl'></i> 
                    <span>Dashboard</span>
                </a>
            </li>
            <li>
                <a href="{% url 'devices:devices' %}" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors font-medium">
                    <i class='bx bx-server text-xl'></i>
                    <span>Devices</span>
                </a>
            </li>
            <li>
                <a href="{% url 'events:events' %}" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors font-medium">
                    <i class='bx bx-bell text-xl'></i>
                    <span>Events</span>
                </a>
            </li>
            <li>
                <a href="reports.html" class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-300 hover:bg-slate-800 hover:text-white transition-colors font-medium">
                    <i class='bx bx-file text-xl'></i>
                    <span>Reports</span>
                </a>
            </li>
        </ul>
    </nav>
    
    <!-- User Profile Section -->
    <div class="px-4 py-4 border-t border-slate-800">
        <div class="flex items-center gap-3 p-2 rounded-lg hover:bg-slate-800 transition-colors">
            
            {% if profile.profile_image %}
                <a href="{% url "edit_profile" %}"><img class="w-10 h-10 rounded-full object-cover border-2 border-cyan-400" src="{{ profile.profile_image.url }}" alt="User Photo"></a>
            {% else %}
                <a href="{% url "edit_profile" %}"><img class="w-10 h-10 rounded-full object-cover border-2 border-cyan-400" src="{% static 'img/profile-image.jpg' %}" alt="User Photo"></a>
            {% endif %}
                
            <div class="hidden md:block">
                <a href="{% url "profile" %}"><p class="text-sm font-semibold text-white">{{ profile.user.username|truncatechars:15 }}</p></a>
                <p class="text-xs text-slate-400">{{ profile.user.email|truncatechars:20 }}</p>
            </div>
        </div>
    </div>
</aside>
