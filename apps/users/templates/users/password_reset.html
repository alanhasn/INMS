{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script
      src="https://kit.fontawesome.com/a2d04d4f09.js"
      crossorigin="anonymous"
    ></script>
  </head>
  <body
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-200"
  >
    <section
      class="w-full max-w-md p-8 bg-gray-900/80 rounded-2xl shadow-2xl border border-gray-800"
    >
      <!-- Back button -->
      <div class="mb-4">
        <a
          href="{% url 'login' %}"
          class="inline-flex items-center gap-2 text-sm text-cyan-400 hover:underline"
        >
          <i class="fa fa-arrow-left"></i> Back to Login
        </a>
      </div>

      <!-- Title -->
      <div class="text-center mb-6">
        <h2 class="text-3xl font-bold text-cyan-400">Reset Password</h2>
        <p class="text-sm text-gray-400 mt-2">
          Enter your email address and we’ll send you a reset link
        </p>
      </div>

      <!-- Display messages -->
      {% if messages %}
      <ul class="mb-4 space-y-2">
        {% for message in messages %}
        <li
          class="p-2 rounded-md text-sm 
              {% if message.tags == 'error' %} bg-red-500/20 text-red-400 border border-red-500/30 
              {% elif message.tags == 'success' %} bg-green-500/20 text-green-400 border border-green-500/30 
              {% else %} bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 {% endif %}"
        >
          {{ message }}
        </li>
        {% endfor %}
      </ul>
      {% endif %}

      <!-- Form -->
      <form method="POST" class="space-y-5">
        {% csrf_token %}
        <div>
          <label for="email" class="block text-sm mb-1 text-gray-300"
            >Email</label
          >
          <input
            type="email"
            name="email"
            required
            class="w-full px-4 py-3 bg-gray-800 text-gray-100 rounded-lg border border-gray-700 focus:ring-2 focus:ring-cyan-500 focus:border-cyan-500 transition"
          />
        </div>

        <button
          type="submit"
          class="w-full py-3 bg-cyan-500 hover:bg-cyan-600 text-black font-bold rounded-lg transition transform hover:scale-[1.02] shadow-lg"
        >
          Send Reset Link
        </button>
      </form>
    </section>
  </body>
</html>
