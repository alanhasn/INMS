{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMS - Internal Network Management System</title>
    <!-- ====================== -->
    <!-- CSS STYLESHEETS       -->
    <!-- ====================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link rel="shortcut icon" href="{% static 'img/logo.svg' %}" type="image/x-icon">
    <style>
        /* User profile styles */
        .profile-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        .profile-wrapper:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .profile-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }

        .profile-info {
            display: none;
        }

        @media (min-width: 768px) {
            .profile-info {
                display: block;
            }

            .profile-name {
                font-size: 0.875rem;
                font-weight: 600;
                color: var(--text-color);
                margin: 0;
            }

            .profile-role {
                font-size: 0.75rem;
                color: var(--light-text);
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        {% include 'users/partials/sidebar.html' %}

        <!-- ====================== -->
        <!-- MAIN CONTENT AREA     -->
        <!-- ====================== -->
        <main id="content">
            {% include 'users/partials/header.html' %}

            <!-- Dashboard Content Area -->
            <div class="container-fluid p-4" id="dashboardContainer">
                <!-- Page Header -->
                <header class="page-header mb-4">
                    <div class="d-flex align-items-center gap-2">
                        <i class='bx bxs-dashboard fs-3 text-primary'></i>
                        <h2 class="mb-0">Dashboard Overview</h2>
                    </div>
                </header>

                {% include 'users/partials/stats_card.html' %}
                
                {% include 'users/partials/events_table.html' %}
            </div>
        </main>
    </div>

    <!-- ====================== -->
    <!-- JAVASCRIPT            -->
    <!-- ====================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Sidebar toggle functionality
        document.getElementById('sidebarCollapse').addEventListener('click', function() {
            document.getElementById('sidebar').classList.toggle('active');
        });
    </script>
</body>
</html>
