{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INMS - Internal Network Management System</title>
    <!-- ====================== -->
    <!-- CSS STYLESHEETS       -->
    <!-- ====================== -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/user_dashboard.css' %}">
    <link rel="shortcut icon" href="{% static 'img/logo.svg' %}" type="image/x-icon">
    <style>
        /* User profile styles */
        .profile-wrapper {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        .profile-wrapper:hover {
            background: rgba(0, 0, 0, 0.05);
        }

        .profile-photo {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--primary-color);
        }

        .profile-info {
            display: none;
        }

        @media (min-width: 768px) {
            .profile-info {
                display: block;
            }

            .profile-name {
                font-size: 0.875rem;
                font-weight: 600;
                color: var(--text-color);
                margin: 0;
            }

            .profile-role {
                font-size: 0.75rem;
                color: var(--light-text);
                margin: 0;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="overlay"></div>
        {% include 'users/partials/sidebar.html' %}

        <!-- ====================== -->
        <!-- MAIN CONTENT AREA     -->
        <!-- ====================== -->
        <main id="content">
            {% include 'users/partials/header.html' %}

            <!-- Dashboard Content Area -->
            <div class="container-fluid p-4" id="dashboardContainer">
                <!-- Page Header -->
                <header class="page-header mb-4">
                    <div class="d-flex align-items-center gap-2">
                        <i class='bx bxs-dashboard fs-3 text-primary'></i>
                        <h2 class="mb-0">Admin Dashboard</h2>
                    </div>
                </header>

                {% include 'users/partials/stats_card.html' %}
                
                {% include 'users/partials/events_table.html' %}
            </div>
        </main>
    </div>

    <!-- ====================== -->
    <!-- JAVASCRIPT            -->
    <!-- ====================== -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('content');
            const overlay = document.querySelector('.overlay');
            const sidebarCollapse = document.getElementById('sidebarCollapse');
            let touchStartX = 0;
            let touchEndX = 0;

            function toggleSidebar() {
                sidebar.classList.toggle('active');
                overlay.classList.toggle('active');
                
                // Prevent body scrolling when sidebar is open on mobile
                if (window.innerWidth <= 768) {
                    if (sidebar.classList.contains('active')) {
                        document.body.style.overflow = 'hidden';
                    } else {
                        document.body.style.overflow = '';
                    }
                }
            }

            function closeSidebar() {
                if (sidebar.classList.contains('active')) {
                    sidebar.classList.remove('active');
                    overlay.classList.remove('active');
                    document.body.style.overflow = '';
                }
            }

            // Toggle sidebar when button is clicked
            sidebarCollapse.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                toggleSidebar();
            });

            // Close sidebar when clicking overlay
            overlay.addEventListener('click', function(e) {
                e.preventDefault();
                closeSidebar();
            });

            // Close sidebar when pressing escape key
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') {
                    closeSidebar();
                }
            });

            // Handle touch events for swipe
            document.addEventListener('touchstart', function(e) {
                touchStartX = e.changedTouches[0].screenX;
            }, false);

            document.addEventListener('touchend', function(e) {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, false);

            function handleSwipe() {
                const swipeDistance = touchEndX - touchStartX;
                const threshold = 100; // minimum distance for swipe

                if (Math.abs(swipeDistance) > threshold) {
                    if (window.innerWidth <= 768) {
                        if (swipeDistance > 0 && !sidebar.classList.contains('active')) {
                            // Swipe right, open sidebar
                            toggleSidebar();
                        } else if (swipeDistance < 0 && sidebar.classList.contains('active')) {
                            // Swipe left, close sidebar
                            closeSidebar();
                        }
                    }
                }
            }

            // Close sidebar when resizing to desktop view
            window.addEventListener('resize', function() {
                if (window.innerWidth > 768) {
                    closeSidebar();
                }
            });
        });
    </script>
</body>
</html>
