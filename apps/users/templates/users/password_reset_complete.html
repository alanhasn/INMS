{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Password Reset Successful</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-200">
    <section class="w-full max-w-md p-8 bg-gray-900/80 rounded-2xl shadow-2xl border border-gray-800 text-center">
      <h2 class="text-3xl font-bold text-green-400 mb-3">Password Reset Successful</h2>
      <p class="text-gray-300 mb-6">
        Your password has been changed successfully.
      </p>
      <a href="{% url 'login' %}"
        class="inline-block w-full py-3 bg-cyan-500 hover:bg-cyan-600 text-black font-bold rounded-lg transition hover:scale-[1.02] shadow-lg">
        Go to Login
      </a>
    </section>
  </body>
</html>
