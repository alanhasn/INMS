<div class="modal fade" id="addDeviceModal" tabindex="-1" aria-labelledby="addDeviceModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="addDeviceModalLabel">
                    <i class='bx bx-plus-circle text-primary me-2'></i>
                    Add New Device
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="addDeviceForm" class="needs-validation" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="newDeviceName" class="form-label d-flex align-items-center gap-2">
                                    <i class='bx bx-tag text-primary'></i>
                                    Device Name
                                </label>
                                <input type="text" class="form-control" id="newDeviceName" required
                                    pattern="[a-zA-Z0-9-_]+"
                                    title="Only letters, numbers, hyphens and underscores are allowed">
                                <div class="invalid-feedback">
                                    Please provide a valid device name.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="newDeviceType" class="form-label d-flex align-items-center gap-2">
                                    <i class='bx bx-devices text-primary'></i>
                                    Device Type
                                </label>
                                <select class="form-select" id="newDeviceType" required>
                                    <option value="" selected disabled>Select device type</option>
                                    <option value="router">Router</option>
                                    <option value="switch">Switch</option>
                                    <option value="server">Server</option>
                                    <option value="firewall">Firewall</option>
                                    <option value="workstation">Workstation</option>
                                </select>
                                <div class="invalid-feedback">
                                    Please select a device type.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="newDeviceIp" class="form-label d-flex align-items-center gap-2">
                                    <i class='bx bx-network-chart text-primary'></i>
                                    IP Address
                                </label>
                                <input type="text" class="form-control" id="newDeviceIp" required
                                    pattern="^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$"
                                    title="Please enter a valid IPv4 address">
                                <div class="invalid-feedback">
                                    Please provide a valid IPv4 address.
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label for="newDeviceLocation" class="form-label d-flex align-items-center gap-2">
                                    <i class='bx bx-map text-primary'></i>
                                    Location
                                </label>
                                <input type="text" class="form-control" id="newDeviceLocation" required>
                                <div class="invalid-feedback">
                                    Please provide a device location.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="newDeviceStatus" class="form-label d-flex align-items-center gap-2">
                                    <i class='bx bx-signal-5 text-primary'></i>
                                    Status
                                </label>
                                <select class="form-select" id="newDeviceStatus" required>
                                    <option value="" selected disabled>Select status</option>
                                    <option value="online">Online</option>
                                    <option value="offline">Offline</option>
                                    <option value="maintenance">Maintenance</option>
                                    <option value="warning">Warning</option>
                                </select>
                                <div class="invalid-feedback">
                                    Please select a device status.
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="newDeviceDescription" class="form-label d-flex align-items-center gap-2">
                                    <i class='bx bx-detail text-primary'></i>
                                    Description
                                </label>
                                <textarea class="form-control" id="newDeviceDescription" rows="4"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary d-flex align-items-center gap-2" data-bs-dismiss="modal">
                    <i class='bx bx-x'></i>
                    Cancel
                </button>
                <button type="button" class="btn btn-primary d-flex align-items-center gap-2" onclick="addDevice()">
                    <i class='bx bx-save'></i>
                    Add Device
                </button>
            </div>
        </div>
    </div>
</div>
