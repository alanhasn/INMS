{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access Denied</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-950 via-gray-900 to-black text-gray-200 font-sans p-4">

    <div class="w-full max-w-md text-center p-8 bg-gray-900/80 rounded-2xl shadow-2xl border border-gray-800">

        <h1 class="text-9xl font-black text-cyan-400 tracking-wider">403</h1>

        <p class="mt-4 text-xl text-gray-300">Access Denied</p>

        <p class="mt-2 text-gray-400">Your account role does not have permission to view this page.</p>

        <div class="mt-8">
            <a href="{% url 'dashboard' %}" class="inline-flex items-center justify-center gap-2 px-6 py-3 bg-cyan-500 hover:bg-cyan-600 text-black font-bold rounded-lg shadow-lg transition-transform duration-300 ease-in-out hover:scale-105">
                <i class="fas fa-home"></i>
                <span>Go Back Home</span>
            </a>
        </div>
    </div>

</body>
</html>
