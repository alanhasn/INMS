<!-- Add New Event Modal -->
<!-- 
    Key Responsive Changes:
    - overflow-y-auto: Adds a scrollbar ONLY if the content is taller than the screen.
    - sm:items-center: Keeps it vertically centered on larger screens.
-->
<div id="addEventModal" class="modal-container hidden fixed inset-0 z-50 flex items-start sm:items-center justify-center p-4 bg-black/60 backdrop-blur-sm overflow-y-auto">
    
    <!--
        Key Responsive Changes:
        - sm:max-w-lg: Uses a standard max-width for consistency.
        - flex flex-col max-h-[95vh]: Turns the modal into a flex column and prevents it from ever being taller than 95% of the viewport height.
    -->
    <div class="w-full max-w-lg bg-slate-800 border border-slate-700 rounded-xl shadow-2xl flex flex-col max-h-[95vh]">
        
        <!-- Modal Header (Remains fixed at the top) -->
        <div class="flex-shrink-0 flex items-center justify-between p-4 border-b border-slate-700">
            <h5 class="flex items-center gap-2 text-lg font-semibold text-white">
                <i class='bx bx-plus-circle text-cyan-400'></i> Add New Event
            </h5>
            <button type="button" data-modal-close class="p-1 rounded-full text-slate-400 hover:bg-slate-700 hover:text-white">
                <i class='bx bx-x text-2xl'></i>
            </button>
        </div>
        <!-- 
            Modal Body (SCROLLABLE)
            - flex-1: Makes this section grow to fill available space.
            - overflow-y-auto: The content inside this div will scroll, not the whole modal.
        -->
        <div class="p-6 flex-1 overflow-y-auto">
            <form id="addEventForm" method="POST" class="space-y-4">
                {% csrf_token %}
                
                <!-- Event Type (CharField) -->
                <div>
                    <label for="eventType" class="block text-sm font-medium text-slate-400 mb-2">Event Type</label>
                    <input type="text" id="eventType" name="event_type" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 focus:ring-2 focus:ring-cyan-500" required placeholder="e.g., High CPU Usage">
                </div>

                <!-- Device (ForeignKey) -->
                <div>
                    <label for="eventDevice" class="block text-sm font-medium text-slate-400 mb-2">Associated Device</label>
                    <select id="eventDevice" name="device" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 focus:ring-2 focus:ring-cyan-500" required>
                        <option value="" disabled selected>Select a device...</option>
                        
                        {# This loop requires a 'devices' variable from your view #}
                        {% for device in devices %}
                            <option value="{{ device.id }}">{{ device.name }} ({{ device.ip }})</option>
                        {% endfor %}
                    </select>
                </div>
                
                <!-- Severity (Choices) -->
                <div>
                    <label for="eventSeverity" class="block text-sm font-medium text-slate-400 mb-2">Severity Level</label>
                    <select id="eventSeverity" name="severity" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 focus:ring-2 focus:ring-cyan-500" required>
                        <option value="Info">Info</option>
                        <option value="Warning">Warning</option>
                        <option value="Error">Error</option>
                        <option value="Critical">Critical</option>
                    </select>
                </div>

                <!-- Description (TextField) -->
                <div>
                    <label for="eventDescription" class="block text-sm font-medium text-slate-400 mb-2">Event Description</label>
                    <textarea id="eventDescription" name="event_description" rows="4" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-3 py-2 focus:ring-2 focus:ring-cyan-500" placeholder="Provide a detailed description of the event..."></textarea>
                </div>

            </form>
        </div>

        <!-- Modal Footer (Remains fixed at the bottom) -->
        <div class="flex-shrink-0 flex items-center justify-end gap-3 p-4 border-t border-slate-700">
            <button type="button" data-modal-close class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-lg transition-colors">Cancel</button>
            <!-- Changed to type="submit" and linked to the form -->
            <button type="submit" form="addEventForm" class="px-4 py-2 bg-cyan-500 hover:bg-cyan-600 text-slate-900 font-semibold rounded-lg shadow-md transition-colors">Add Event</button>
        </div>
    </div>
</div>
