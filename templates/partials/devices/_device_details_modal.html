<!-- Device Details Modal -->
<div id="deviceDetailsModal" class="modal-container hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
    <div class="w-full max-w-lg bg-slate-800 border border-slate-700 rounded-xl shadow-2xl">
        <!-- Modal Header -->
        <div class="flex items-center justify-between p-4 border-b border-slate-700">
            <h5 class="flex items-center gap-2 text-lg font-semibold text-white">
                <i class='bx bx-info-circle text-cyan-400'></i> Device Details
            </h5>
            <button type="button" data-modal-close class="p-1 rounded-full text-slate-400 hover:bg-slate-700 hover:text-white">
                <i class='bx bx-x text-2xl'></i>
            </button>
        </div>

        <!-- Modal Body -->
        <div class="p-6 grid grid-cols-2 gap-4 text-sm">
            <div>
                <p class="text-slate-400">Device Name</p>
                <p id="detailDeviceName" class="text-white font-medium mt-0.5"></p>
            </div>
            <div>
                <p class="text-slate-400">Type</p>
                <p id="detailDeviceType" class="text-white font-medium mt-0.5"></p>
            </div>
            <div>
                <p class="text-slate-400">IP Address</p>
                <p id="detailDeviceIp" class="text-white font-mono mt-0.5"></p>
            </div>
            <div>
                <p class="text-slate-400">MAC Address</p>
                <p id="detailDeviceMac" class="text-white font-mono mt-0.5"></p>
            </div>
            <div>
                <p class="text-slate-400">Port</p>
                <p id="detailDevicePort" class="text-white font-mono mt-0.5"></p>
            </div>
            <div>
                <p class="text-slate-400">Status</p>
                <p id="detailDeviceStatus" class="text-white font-medium mt-0.5"></p>
            </div>
            <div>
                <p class="text-slate-400">Location</p>
                <p id="detailDeviceLocation" class="text-white font-medium mt-0.5"></p>
            </div>
            <div>
                <p class="text-slate-400">Owner</p>
                <p id="detailDeviceOwner" class="text-white font-medium mt-0.5"></p>
            </div>
            <div class="col-span-2">
                <p class="text-slate-400">Description</p>
                <p id="detailDeviceDescription" class="text-slate-300 mt-0.5"></p>
            </div>
        </div>

        <!-- Modal Footer -->
        <div class="flex items-center justify-end p-4 border-t border-slate-700">
            <button type="button" data-modal-close class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-white font-semibold rounded-lg transition-colors">Close</button>
        </div>
    </div>
</div>
